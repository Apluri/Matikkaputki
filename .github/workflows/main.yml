on:
 push:
   branches: [ feat-pipeline-setup ]
  
defaults:
  run:
    working-directory: ./MathWorkshop

jobs:
 build:
   runs-on: ubuntu-latest
   steps:
   - uses: actions/checkout@v3
   - name: Setup .NET
     uses: actions/setup-dotnet@v3
     with:
       dotnet-version: '8.0.x'
   - name: run dotnet restore
   - run: dotnet restore

   - name: run dotnet build
   - run: dotnet build
